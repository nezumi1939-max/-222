<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7f5"><title>かんたんレジ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#172e26;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;font-size:15px}button,input{font:inherit}button{cursor:pointer;color:inherit;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #7cba9a;outline-offset:2px}.wrap{max-width:1080px;margin:auto;padding:20px 16px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:25px;margin:0;letter-spacing:.02em}h2{font-size:16px;margin:0 0 14px}small,.muted{color:#64746b;font-size:12px}.tabs{display:flex;gap:4px;background:#e4ebe6;padding:4px;border-radius:12px}.tabs button{border:0;background:transparent;border-radius:9px;padding:10px 13px;font-size:14px;font-weight:700;white-space:nowrap}.tabs .active{background:#fff;box-shadow:0 1px 4px #183b261a}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}.panel{background:#fff;border:1px solid #dce5df;border-radius:16px;padding:17px;box-shadow:0 2px 8px #193b2310}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid #cdded2;border-radius:12px;background:#f7faf7;min-height:94px;padding:13px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;font-weight:700;overflow-wrap:anywhere}.product:active{background:#dceee1}.price{font-size:22px;color:#226448;font-variant-numeric:tabular-nums}.cart-line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e6ece8;gap:8px}.cart-name{min-width:0;overflow-wrap:anywhere}.qty{display:flex;align-items:center;gap:8px;flex-shrink:0}.qty button{border:1px solid #d7e2db;background:#fff;border-radius:8px;width:35px;height:35px;font-size:20px}.qty span{min-width:16px;text-align:center;font-weight:700}.empty{padding:20px 0;color:#78857d;text-align:center}.tot{display:flex;align-items:center;justify-content:space-between;padding:15px 0 10px;gap:8px}.tot strong{font-size:34px;font-variant-numeric:tabular-nums}.head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}.head-row h2{margin:0}.ghost{background:#fff;border:1px solid #d7e2db;border-radius:9px;padding:9px 12px;font-weight:600;font-size:13px}.danger{color:#a03232}.cash{border-top:1px solid #dce5df;padding-top:13px}.cash label{display:block;font-weight:700;margin-bottom:7px}.money-input{width:100%;border:1px solid #bacdc0;border-radius:10px;padding:11px 12px;text-align:right;font-size:24px;color:#183b2d;background:#fff}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.quick button{border:1px solid #c9dfd0;background:#edf6ef;border-radius:9px;padding:11px 4px;font-size:13px;font-weight:700;white-space:nowrap}.quick button:first-child{background:#dceee1}.change{background:#e8f5ec;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0;color:#195c3e}.change strong{font-size:31px;font-variant-numeric:tabular-nums}.change.short{background:#fff0eb;color:#a43b24}.primary{background:#236447;color:#fff;border:0;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:700;width:100%}.primary:active{background:#174c34}.notice{min-height:20px;font-size:13px;color:#206445;margin-top:9px;overflow-wrap:anywhere}.edit-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,120px) auto;gap:8px;align-items:center;margin-bottom:9px}.edit-row input{width:100%;min-width:0;border:1px solid #cbd9cf;border-radius:9px;padding:11px 9px;background:#fff;color:#172e26}.edit-row button{padding:11px 9px}.edit-label{font-size:12px;color:#64746b}.actions{display:flex;gap:8px;margin-top:16px}.actions .primary{flex:1}.actions .ghost{flex:1}.hidden{display:none!important}.footer{margin-top:16px;text-align:center;font-size:12px;color:#64746b}.status{font-size:12px;color:#64746b;margin-top:4px}.receipt{margin-top:10px;border:1px solid #d3e6d9;background:#f6fbf7;border-radius:10px;padding:12px;font-size:14px;line-height:1.7} @media(max-width:680px){.layout{grid-template-columns:1fr}.wrap{padding:13px 10px 24px}h1{font-size:21px}.panel{padding:13px}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product{min-height:82px;padding:9px;font-size:13px}.price{font-size:19px}.tabs button{padding:9px 10px}.tot strong{font-size:31px}}@media(max-width:350px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.edit-row{grid-template-columns:minmax(0,1fr) 72px auto}}
.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.product{min-height:64px;align-items:center;justify-content:center;text-align:center;padding:8px}.price{font-size:clamp(18px,5vw,25px);white-space:nowrap}.edit-row{grid-template-columns:minmax(0,1fr) auto}.cart-name>div{font-weight:700}.quick button{min-height:46px}.quick button:first-child{grid-column:span 2}@media(max-width:350px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main class="wrap"><header><div><h1>かんたんレジ</h1><div class="status">現金会計専用</div></div><nav class="tabs"><button id="saleTab" class="active">レジ</button><button id="editTab">価格編集</button></nav></header><div id="sale" class="layout"><section class="panel"><div class="head-row"><h2>価格を選択</h2><small id="count"></small></div><div id="products" class="product-grid"></div><p class="muted">同じ価格を何回でも押せます。</p></section><section class="panel"><div class="head-row"><h2>お会計 <small id="items"></small></h2><button class="ghost danger" id="clear">全取消</button></div><div id="cart"></div><div class="tot"><span>合計金額</span><strong id="total">¥0</strong></div><div class="cash"><label for="paid">お預かり金額（円）</label><input id="paid" class="money-input" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off"><div class="quick" id="quick"></div><button class="ghost" id="cashReset" style="width:100%;margin-bottom:8px">預かり金額をリセット</button><small>最初の＋は合計金額に加算し、次からはお預かり金額に加算します。</small><div id="changeBox" class="change"><span id="changeLabel">お釣り</span><strong id="change">—</strong></div><button class="primary" id="complete" disabled>会計完了</button><div class="notice" id="notice" role="status"></div><div id="receipt" class="receipt hidden"></div></div></section></div><section class="panel hidden" id="editor"><h2>価格編集</h2><p class="muted">よく使う販売価格（税込）を登録してください。価格は安い順に表示されます。</p><div class="edit-row edit-label"><span>価格（円）</span><span></span></div><div id="editList"></div><button class="ghost" id="add">＋ 価格を追加</button><div class="actions"><button class="ghost" id="cancelEdit">戻る</button><button class="primary" id="save">保存する</button></div><div id="editNotice" class="notice" role="status"></div></section><div class="footer" id="storageStatus">価格設定はこの端末のブラウザに保存されます。</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),yen=n=>'¥'+n.toLocaleString('ja-JP'), key='simple-register-prices-v2';let products=[50,100,150,200,250,300,350,400,450,500,1000].map(price=>({id:String(price),name:price+'円',price})),cart=new Map(),draft=[],paid=null,serial=0;const max=999999999;try{const v=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(v)&&v.every(n=>Number.isInteger(n)&&n>0&&n<=999999))products=[...new Set(v)].sort((a,b)=>a-b).map(price=>({id:String(price),name:price+'円',price}));}catch(e){$('storageStatus').textContent='ブラウザの保存機能が使えない場合、再読み込みすると設定は初期化されます。';}const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};const total=()=>[...cart.values()].reduce((s,p)=>s+p.price*p.qty,0);const count=()=>[...cart.values()].reduce((s,p)=>s+p.qty,0);function setPaid(v){paid=v;$('paid').value=v===null?'':String(v);renderMoney();}function renderMoney(){const t=total(),c=paid===null?0:paid-t;$('total').textContent=yen(t);$('items').textContent=count()+'点';$('changeBox').classList.toggle('short',paid!==null&&c<0);$('changeLabel').textContent=paid!==null&&c<0?'不足金額':'お釣り';$('change').textContent=paid===null?'—':yen(Math.abs(c));$('complete').disabled=!cart.size||paid===null||c<0;$('clear').disabled=!cart.size&&paid===null;document.querySelectorAll('#quick button').forEach(b=>b.disabled=!cart.size||(Number(b.dataset.plus)===0?t:(paid??t)+Number(b.dataset.plus))>max);}
function renderProducts(){$('products').replaceChildren();$('count').textContent=products.length+'種類';if(!products.length)$('products').append(el('p','muted','価格編集から価格を登録してください。'));for(const p of products){const b=el('button','product');b.append(el('span','price',p.price.toLocaleString('ja-JP')+'円'));b.onclick=()=>{const old=cart.get(p.id);if(total()+(old?.price??p.price)>max)return;cart.set(p.id,{...(old||p),qty:(old?.qty||0)+1});changed()};$('products').append(b);}}
function changed(){setPaid(null);$('notice').textContent='';$('receipt').classList.add('hidden');renderCart();}
function renderCart(){$('cart').replaceChildren();if(!cart.size)$('cart').append(el('div','empty','価格を選択してください'));for(const p of cart.values()){const r=el('div','cart-line'),name=el('div','cart-name'),q=el('div','qty'),minus=el('button','','−'),plus=el('button','','＋');name.append(el('div','',p.name),el('small','',yen(p.price)+' × '+p.qty+' = '+yen(p.price*p.qty)));minus.setAttribute('aria-label',p.name+'を1個減らす');plus.setAttribute('aria-label',p.name+'を1個増やす');minus.onclick=()=>{if(p.qty===1)cart.delete(p.id);else p.qty--;changed()};plus.onclick=()=>{if(total()+p.price<=max){p.qty++;changed()}};q.append(minus,el('span','',String(p.qty)),plus);r.append(name,q);$('cart').append(r);}renderMoney();}
for(const n of [0,50,100,500,1000]){const b=el('button','',n?'+'+n.toLocaleString('ja-JP')+'円':'ちょうど');b.dataset.plus=n;b.onclick=()=>setPaid(n===0?total():(paid??total())+n);$('quick').append(b);}$('cashReset').onclick=()=>setPaid(null);$('paid').addEventListener('input',()=>{const v=$('paid').value.normalize('NFKC').replace(/[^0-9]/g,'').slice(0,9);paid=v===''?null:Number(v);$('paid').value=v;renderMoney()});$('clear').onclick=()=>{cart.clear();changed()};$('complete').onclick=()=>{if(!cart.size||paid===null||paid<total())return;const t=total(),p=paid,c=p-t,num=count();cart.clear();setPaid(null);renderCart();$('notice').textContent='会計が完了しました。';$('receipt').textContent='前回のお会計：'+num+'点 ／ 合計 '+yen(t)+' ／ お預かり '+yen(p)+' ／ お釣り '+yen(c);$('receipt').classList.remove('hidden');};function showEdit(){draft=products.map(p=>({...p,price:String(p.price)}));$('sale').classList.add('hidden');$('editor').classList.remove('hidden');$('saleTab').classList.remove('active');$('editTab').classList.add('active');$('editNotice').textContent='';renderEdit();}function showSale(){$('editor').classList.add('hidden');$('sale').classList.remove('hidden');$('editTab').classList.remove('active');$('saleTab').classList.add('active');renderProducts();renderCart();}
function renderEdit(){$('editList').replaceChildren();for(const p of draft){const row=el('div','edit-row'),price=el('input'),del=el('button','ghost danger','削除');price.value=p.price;price.type='text';price.inputMode='numeric';price.placeholder='価格';price.setAttribute('aria-label','価格（円）');price.oninput=()=>p.price=price.value;del.onclick=()=>{draft=draft.filter(x=>x!==p);renderEdit()};row.append(price,del);$('editList').append(row);}}$('add').onclick=()=>{draft.push({price:''});renderEdit();$('editList').lastElementChild?.firstElementChild?.focus()};$('save').onclick=()=>{const next=[];for(const p of draft){const v=p.price.trim().normalize('NFKC');if(!/^\d+$/.test(v)||Number(v)<1||Number(v)>999999){$('editNotice').textContent='1〜999,999円の整数価格を入力してください。';return;}next.push(Number(v));}if(new Set(next).size!==next.length){$('editNotice').textContent='同じ価格が重複しています。';return;}products=next.sort((a,b)=>a-b).map(price=>({id:String(price),name:price+'円',price}));try{localStorage.setItem(key,JSON.stringify(next));$('storageStatus').textContent='価格設定はこの端末のブラウザに保存されました。';}catch(e){$('storageStatus').textContent='端末への保存に失敗しました。設定はこの画面を閉じると失われる場合があります。';}showSale();$('notice').textContent='価格設定を保存しました。';};$('saleTab').onclick=showSale;$('editTab').onclick=()=>{if($('editor').classList.contains('hidden'))showEdit()};$('cancelEdit').onclick=showSale;renderProducts();renderCart();})();
</script></body></html>
